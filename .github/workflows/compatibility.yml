name: Best-effort compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run fixtures:generate
      - run: npm test
      - run: npm run doctor -- --cache-mode none --allow-root .
      - run: npm run evaluation:verify
      - run: npm run test:local-pdfs
      - run: npm run check

  linux-ocr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update
      - run: sudo apt-get install -y tesseract-ocr
      - run: npm ci
      - run: npm run fixtures:generate
      - run: npm run test:ocr
        env:
          PDF_DECOMPILER_TEST_OCR: "1"
